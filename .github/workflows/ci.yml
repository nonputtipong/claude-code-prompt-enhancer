name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['plugins/**', '.claude-plugin/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['plugins/**', '.claude-plugin/**', '.github/workflows/ci.yml']

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code 2.1.296
        run: npm install -g @anthropic-ai/claude-code@2.1.296 && claude --version
      - name: Validate the plugin and marketplace
        run: claude plugin validate plugins/prompt-enhancer && claude plugin validate .
      - name: Plugin tests
        run: claude plugin test plugins/prompt-enhancer
